<dialog id="physician-booking" aria-labelledby="physician-booking-title"><div class="physician-form-head"><h2 id="physician-booking-title">Записатися</h2><button type="button" class="dialog-close" data-dialog-close aria-label="Закрити форму">×</button></div><form data-form="booking" novalidate><p>Залиште контакти для узгодження візиту.</p><label for="appointment-name">ПІБ</label><input id="appointment-name" name="name" autocomplete="name" minlength="2" maxlength="100" required><label for="appointment-phone">Телефон</label><input id="appointment-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 97 000 00 00" required><label for="appointment-doctor">Спеціаліст</label><select id="appointment-doctor" name="doctorId" required><option value="">Оберіть лікаря</option>${doctor_options}</select><label for="appointment-branch">Відділення</label><select id="appointment-branch" name="branchId" required><option value="dnipro-main">Дніпро, вул. Української Добровольчої армії, 2-Б</option></select><p class="form-status" role="status" aria-live="polite" hidden></p><button class="button primary" type="submit">Записатися</button><p class="physician-form-contact">Або зателефонуйте: <a href="tel:+380975323664">+380 97 532 36 64</a></p></form></dialog>
<dialog id="physician-review" aria-labelledby="physician-review-title"><div class="physician-form-head"><h2 id="physician-review-title">Залишити відгук</h2><button type="button" class="dialog-close" data-dialog-close aria-label="Закрити форму">×</button></div><form data-form="review" novalidate><input type="hidden" name="doctorId" value="${page_doctor}"><label for="review-name">ПІБ</label><input id="review-name" name="name" autocomplete="name" minlength="2" maxlength="100" required><fieldset class="physician-stars"><legend>Ваша оцінка</legend>${rating_options}</fieldset><label for="review-text">Ваш відгук</label><textarea id="review-text" name="text" minlength="2" maxlength="400" rows="5" aria-describedby="review-count" required></textarea><p id="review-count" class="review-count">0 / 400</p><p class="review-moderation">Відгук з’явиться після перевірки модератором.</p><p class="form-status" role="status" aria-live="polite" hidden></p><button class="button primary" type="submit">Надіслати відгук</button></form></dialog>
